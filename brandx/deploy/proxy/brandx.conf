# BrandX uchun host nginx server blok namunasi.
#
# DOMENSIZ ishlayotganda KERAK EMAS - Django o'zi 80-portda turadi.
# Kelajakda domen ulangach ishlatiladi:
#   1) server_name ga domeningizni yozing
#   2) deploy/.env.prod da BRANDX_HTTP_BIND=127.0.0.1 qiling (tashqariga yopiq)
#   3) sudo cp deploy/proxy/brandx.conf /etc/nginx/sites-available/brandx.conf
#   4) sudo ln -s /etc/nginx/sites-available/brandx.conf /etc/nginx/sites-enabled/
#   5) sudo nginx -t && sudo systemctl reload nginx
#   6) sudo certbot --nginx -d <domen>          # HTTPS
#   7) deploy/.env.prod da SECURE_* bayroqlarini yoqing (README 9-bo'lim)
server {
    listen 80;
    server_name pos.example.com;   # <-- domeningiz

    client_max_body_size 20m;      # mahsulot rasmlari uchun

    location / {
        proxy_pass http://127.0.0.1:8080;   # BRANDX_HTTP_PORT bilan bir xil
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # Django is_secure() uchun
    }
}
