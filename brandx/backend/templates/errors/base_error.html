<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block error_title %}Xatolik{% endblock %} · BrandX</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #f4f6fb; color: #1c2333;
    }
    .err { max-width: 560px; width: 100%; }
    .err-code {
      font-size: 92px; font-weight: 800; line-height: 1;
      letter-spacing: -4px; color: #4f46e5;
    }
    .err h1 { font-size: 26px; margin: 18px 0 8px; }
    .err p { margin: 0 0 6px; font-size: 16px; }
    .err-ru { color: #6b7590; font-size: 14px; }
    .err-actions { margin-top: 26px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-block; padding: 10px 18px; border-radius: 10px;
      border: 1px solid #d7dcea; background: #fff; color: #1c2333;
      text-decoration: none; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .btn:hover { border-color: #4f46e5; }
    .btn-primary { background: #4f46e5; border-color: #4f46e5; color: #fff; }
    .btn-primary:hover { background: #4338ca; border-color: #4338ca; }
    .err-foot { margin-top: 30px; font-size: 12px; color: #8b93ad; }
    @media (prefers-color-scheme: dark) {
      body { background: #0b0f1a; color: #e8ebf5; }
      .err-code { color: #8d86f3; }
      .err-ru, .err-foot { color: #8b93ad; }
      .btn { background: #141b2e; border-color: #2a3350; color: #e8ebf5; }
      .btn:hover { border-color: #8d86f3; }
      .btn-primary { background: #7c74f0; border-color: #7c74f0; color: #0b0f1a; }
      .btn-primary:hover { background: #8d86f3; border-color: #8d86f3; }
    }
  </style>
</head>
<body>
  <main class="err">
    <div class="err-code">{% block error_code %}{% endblock %}</div>
    <h1>{% block error_heading %}{% endblock %}</h1>
    <p>{% block error_text %}{% endblock %}</p>
    <p class="err-ru">{% block error_text_ru %}{% endblock %}</p>
    <div class="err-actions">
      <a class="btn btn-primary" href="/dashboard/">Bosh sahifaga</a>
      <a class="btn" href="/pos/">Kassaga (POS)</a>
      <button class="btn" type="button" onclick="history.back()">Orqaga qaytish</button>
    </div>
    <p class="err-foot">BrandX</p>
  </main>
</body>
</html>
